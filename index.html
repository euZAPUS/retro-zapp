<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>retro-zapp · Demos</title>
<meta name="description" content="Portfolio de demos interactivas: ZAP Arcade y más.">
<meta name="author" content="euZAPUS">
<meta name="copyright" content="© 2026 euZAPUS. Todos los derechos reservados.">
<style>
:root{
  --ink:#0b0d18;--panel:#121528;--text:#e7eaff;--muted:#8f95c2;
  --cyan:#4df0ff;--magenta:#ff4d8d;--violet:#9b7bff;
  --glass:color-mix(in srgb,var(--panel) 58%,transparent);
  --glass-line:color-mix(in srgb,var(--text) 14%,transparent);
  --f:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--text);font:14px/1.5 var(--f);padding:16px 16px 48px}
.orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;background:radial-gradient(circle,var(--o) 0%,transparent 62%);opacity:.26;animation:drift 28s ease-in-out infinite alternate}
.orbs i:nth-child(1){--o:var(--cyan);left:-18vmax;top:-20vmax}
.orbs i:nth-child(2){--o:var(--magenta);right:-22vmax;top:10vmax;animation-duration:34s;animation-delay:-9s}
.orbs i:nth-child(3){--o:var(--violet);left:10vmax;bottom:-30vmax;animation-duration:40s;animation-delay:-17s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{position:relative;max-width:880px;margin:0 auto}
header{padding:64px 0 32px}
h1{margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:-.02em;animation:rise .7s both}
h1 b{color:var(--cyan)}
header p{margin:8px 0 0;color:var(--muted);animation:rise .7s .1s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{
  position:relative;display:block;padding:24px;border-radius:16px;color:inherit;text-decoration:none;
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .2s,border-color .3s,box-shadow .3s;animation:rise .7s .2s both;overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--cyan) 28%,transparent),transparent 70%)}
.card:hover,.card:focus-visible{border-color:var(--cyan);box-shadow:0 12px 40px color-mix(in srgb,var(--cyan) 22%,transparent);outline:none}
.card:hover::before,.card:focus-visible::before{opacity:1}
.card h2{margin:0 0 6px;font-size:20px}
.card p{margin:0 0 16px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--glass-line);color:var(--cyan)}
.go{position:absolute;top:20px;right:22px;color:var(--cyan);transition:transform .25s}
.card:hover .go{transform:translate(4px,-4px)}
.card.soon{opacity:.55;border-style:dashed;pointer-events:none}
footer{margin-top:48px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <header>
    <h1>retro-<b>zapp</b></h1>
    <p>Demos interactivas hechas a mano, sin dependencias.</p>
  </header>
  <section class="grid" aria-label="Demos">
    <a class="card" href="demos/arcade/">
      <span class="go" aria-hidden="true">↗</span>
      <h2>ZAP Arcade</h2>
      <p>13 minijuegos con modos de juego, perfil con récords y logros, 9 temas y efectos de cristal.</p>
      <div class="tags"><span>Canvas</span><span>13 juegos</span><span>Perfil y logros</span></div>
    </a>
    <div class="card soon" aria-disabled="true">
      <h2>Próximamente</h2>
      <p>Aquí irá la siguiente demo.</p>
    </div>
  </section>
  <footer>© 2026 euZAPUS · Todos los derechos reservados</footer>
</main>
<script>
// Inclinación 3D y brillo que sigue al cursor (se desactiva con "reducir movimiento")
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.querySelectorAll('.card:not(.soon)').forEach(c=>{
    c.addEventListener('pointermove',e=>{
      const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      c.style.setProperty('--ry',((x-.5)*10).toFixed(2)+'deg');
      c.style.setProperty('--rx',((.5-y)*10).toFixed(2)+'deg');
      c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');
    });
    c.addEventListener('pointerleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')});
  });
}
</script>
</body>
</html>
